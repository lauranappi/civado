name: Serate Night Life Bergamo
on:
  schedule:
    - cron: "30 6 * * 1,5"   # lunedì e venerdì, 07:30 circa in Italia
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  leggi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Leggi le locandine e aggiorna eventi.json
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 scripts/night_life.py
      - name: Salva le modifiche
        run: |
          git config user.name "Ci Vado bot"
          git config user.email "actions@users.noreply.github.com"
          git add eventi.json scripts/night_life_stato.json
          git diff --cached --quiet || git commit -m "Serate Night Life Bergamo: aggiornamento automatico"
          git pull --rebase -q && git push
