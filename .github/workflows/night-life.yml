name: Locandine Night Life Bergamo
on:
  schedule:
    - cron: "30 5 * * 1"   # ogni lunedì, circa 06:30 in Italia (prima dell'aggiornamento settimanale)
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  scarica:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scarica le locandine recenti
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: python3 scripts/scarica_locandine.py
      - name: Pubblica sul ramo temporaneo (sovrascritto a ogni esecuzione)
        run: |
          git config user.name "Ci Vado bot"
          git config user.email "actions@users.noreply.github.com"
          git checkout --orphan locandine-night-life
          git rm -rf -q --cached . 
          git add -f locandine
          git commit -q -m "Locandine Night Life Bergamo $(date +%F)"
          git push -f origin locandine-night-life
